name: ESP32-S3 N16R8 Build

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    container:
      image: espressif/idf:v6.1

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build firmware
        shell: bash
        run: |
          . /opt/esp/idf/export.sh

          rm -f sdkconfig
          rm -rf build

          idf.py set-target esp32s3
          idf.py build

      - name: Create merged first-flash binary
        shell: bash
        run: |
          . /opt/esp/idf/export.sh

          mkdir -p artifacts/first-flash

          cd build

          esptool --chip esp32s3 merge-bin \
            -o ../artifacts/first-flash/esp32s3-n16r8-merged.bin \
            @flash_args

      - name: Prepare OTA firmware
        shell: bash
        run: |
          mkdir -p artifacts/ota

          cp build/esp32-ota.bin \
            artifacts/ota/esp32-ota.bin

      - name: Prepare build files
        shell: bash
        run: |
          mkdir -p artifacts/build

          cp build/bootloader/bootloader.bin \
            artifacts/build/bootloader.bin

          cp build/partition_table/partition-table.bin \
            artifacts/build/partition-table.bin

          cp build/esp32-ota.bin \
            artifacts/build/esp32-ota.bin

          cp build/flash_args \
            artifacts/build/flash_args

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: esp32s3-n16r8-firmware
          path: artifacts/
